<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon outil PDF</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      text-align: center;
    }
    h1 { color: #2563eb; }
    h2 { color: #059669; margin-top: 40px; }
    .drop-zone {
      border: 3px dashed #2563eb;
      padding: 40px;
      margin: 20px 0;
      border-radius: 10px;
      cursor: pointer;
    }
    .drop-zone:hover { background: #eff6ff; }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 16px;
      border-radius: 6px;
      cursor: pointer;
      margin: 10px 5px;
    }
    button:hover { background: #1d4ed8; }
    button:disabled { background: #9ca3af; cursor: not-allowed; }
    input[type="text"] {
      padding: 10px;
      font-size: 14px;
      border: 2px solid #d1d5db;
      border-radius: 6px;
      width: 200px;
    }
    #status { margin-top: 20px; color: #059669; font-weight: bold; }
    .section {
      border: 1px solid #e5e7eb;
      padding: 20px;
      margin: 20px 0;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>📄 Mon outil PDF</h1>

  <!-- SECTION FUSION -->
  <div class="section">
    <h2>🔗 Fusionner des PDF</h2>
    <p>Choisis plusieurs fichiers PDF, puis clique sur "Fusionner"</p>

    <div class="drop-zone" onclick="document.getElementById('files').click()">
      📁 Clique ici pour choisir des PDF
      <input type="file" id="files" accept="application/pdf" multiple hidden>
    </div>

    <div id="file-list"></div>

    <button id="merge-btn" disabled>Fusionner les PDF</button>
  </div>

  <!-- SECTION DECOUPE -->
  <div class="section">
    <h2>✂️ Découper un PDF</h2>
    <p>Choisis un PDF, puis indique les pages à extraire</p>

    <div class="drop-zone" onclick="document.getElementById('split-file').click()">
      📁 Clique ici pour choisir un PDF
      <input type="file" id="split-file" accept="application/pdf" hidden>
    </div>

    <div id="split-file-info"></div>

    <input type="text" id="pages-input" placeholder="Ex: 1,3,5-7">
    <button id="split-btn" disabled>Extraire les pages</button>
  </div>

  <div id="status"></div>

  <!-- La bibliothèque magique qui manipule les PDF -->
  <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>

  <script>
    const { PDFDocument } = PDFLib;
    let selectedFiles = [];
    let splitFile = null;

    // ====== FUSION ======
    const filesInput = document.getElementById('files');
    const mergeBtn = document.getElementById('merge-btn');
    const fileList = document.getElementById('file-list');
    const status = document.getElementById('status');

    filesInput.addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      fileList.innerHTML = selectedFiles
        .map(f => `<p>✅ ${f.name}</p>`)
        .join('');
      mergeBtn.disabled = selectedFiles.length < 2;
    });

    mergeBtn.addEventListener('click', async () => {
      status.textContent = '⏳ Fusion en cours...';
      mergeBtn.disabled = true;

      try {
        const mergedPdf = await PDFDocument.create();

        for (const file of selectedFiles) {
          const arrayBuffer = await file.arrayBuffer();
          const pdf = await PDFDocument.load(arrayBuffer);
          const pages = await mergedPdf.copyPages(pdf, pdf.getPageIndices());
          pages.forEach(page => mergedPdf.addPage(page));
        }

        const pdfBytes = await mergedPdf.save();
        download(pdfBytes, 'fusionne.pdf', 'application/pdf');

        status.textContent = '✅ Fusion réussie !';
      } catch (error) {
        status.textContent = '❌ Erreur : ' + error.message;
        console.error(error);
      } finally {
        mergeBtn.disabled = false;
      }
    });

    // ====== DECOUPE ======
    const splitFileInput = document.getElementById('split-file');
    const splitBtn = document.getElementById('split-btn');
    const splitFileInfo = document.getElementById('split-file-info');

    splitFileInput.addEventListener('change', async (e) => {
      splitFile = e.target.files[0];
      if (!splitFile) return;

      // Lire le PDF pour connaître le nombre de pages
      const arrayBuffer = await splitFile.arrayBuffer();
      const pdf = await PDFDocument.load(arrayBuffer);
      const numPages = pdf.getPageCount();

      splitFileInfo.innerHTML = `<p>✅ ${splitFile.name} (${numPages} pages)</p>`;
      splitBtn.disabled = false;
    });

    splitBtn.addEventListener('click', async () => {
      const input = document.getElementById('pages-input').value;
      if (!splitFile || !input) {
        status.textContent = '❌ Choisis un fichier et indique les pages';
        return;
      }

      status.textContent = '⏳ Découpe en cours...';
      splitBtn.disabled = true;

      try {
        const arrayBuffer = await splitFile.arrayBuffer();
        const pdf = await PDFDocument.load(arrayBuffer);
        const pageIndices = parsePages(input, pdf.getPageCount());

        if (pageIndices.length === 0) {
          status.textContent = '❌ Aucune page valide trouvée';
          splitBtn.disabled = false;
          return;
        }

        const newPdf = await PDFDocument.create();
        const pages = await newPdf.copyPages(pdf, pageIndices);
        pages.forEach(page => newPdf.addPage(page));

        const pdfBytes = await newPdf.save();
        download(pdfBytes, 'extrait.pdf', 'application/pdf');

        status.textContent = '✅ Découpe réussie !';
      } catch (error) {
        status.textContent = '❌ Erreur : ' + error.message;
        console.error(error);
      } finally {
        splitBtn.disabled = false;
      }
    });

    // Fonction pour parser "1,3,5-7" en [0, 2, 4, 5, 6]
    function parsePages(input, maxPages) {
      const indices = new Set();
      input.split(',').forEach(part => {
        part = part.trim();
        if (part.includes('-')) {
          const [start, end] = part.split('-').map(Number);
          for (let i = start; i <= end && i <= maxPages; i++) {
            indices.add(i - 1);
          }
        } else {
          const n = Number(part);
          if (n >= 1 && n <= maxPages) indices.add(n - 1);
        }
      });
      return Array.from(indices).sort((a, b) => a - b);
    }

    // Fonction utilitaire pour télécharger
    function download(data, filename, type) {
      const blob = new Blob([data], { type: type });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }
  </script>
</body>
</html>
